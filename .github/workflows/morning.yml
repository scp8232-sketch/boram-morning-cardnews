name: 이보람의 평일 아침 카드뉴스

on:
  schedule:
    # Mon-Fri Seoul 05:10, previous UTC day 20:10
    - cron: '10 20 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-cardnews-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Python 패키지 설치
        run: pip install -r requirements.txt
      - name: 검증된 오늘 카드뉴스 두 장 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: python -m src.automation
      - name: 완성된 카드뉴스 날짜별 저장 (충돌 시 재시도)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fresh=$(mktemp -d)
          cp -a docs/. "$fresh/"
          saved=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$fresh/." docs/
            git add docs/
            if git diff --cached --quiet; then saved=true; break; fi
            git commit -m "cards: $(TZ=Asia/Seoul date +%F)"
            if git push origin HEAD:main; then saved=true; break; fi
            sleep $((attempt*5))
          done
          if [ "$saved" != true ]; then echo '뉴스 저장 실패' >&2; exit 1; fi
      - name: GitHub Pages 배포 자료 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: 제작 실패 기록
        if: failure()
        run: echo '검증 또는 저장 실패. 미검증 카드를 보내지 않습니다.'

  deploy:
    # Keep deployment independent from build so an artifact failure can be retried alone.
    needs: build
    concurrency:
      group: morning-cardnews-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
